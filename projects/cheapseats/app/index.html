    <title>CheapSeats</title>
    <!--
      Pre-paint theme: the saved theme preference loads asynchronously from the
      Tauri store, so without this the first frames always render the system
      theme. ThemeProvider mirrors every applied theme to localStorage under
      'cheapseats.theme' (THEME_MIRROR_KEY in src/lib/theme.ts); this sets it
      before first paint and ThemeProvider takes over once settings load.
      CSP: tauri.conf.json has script-src 'self', but Tauri hashes inline
      scripts in bundled HTML at build time and adds them to the CSP
      (dangerousDisableAssetCspModification is unset), so this is allowed.
    -->
    <script>
      try {
        var t = localStorage.getItem('cheapseats.theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        /* storage blocked: ThemeProvider applies the theme once React mounts */
      }
    </script>
