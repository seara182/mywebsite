<style>
  html { scroll-behavior: smooth; overflow-x: hidden; }
  body { margin: 0; background: var(--paper); overflow-x: hidden; }
  @keyframes scrollHint { 0% { transform: translateY(-100%); } 60%,100% { transform: translateY(220%); } }

  /* #root owns the stacking context for the page's depth planes. */
  #root { position: relative; z-index: 0; }

  /* ------------------------------------------------------------
     Section rail. The brief rules out a classic menu but allows a
     discreet scroll indicator, so this reports position and offers a
     jump - nothing else. A hairline and seven dots: no pill, no border,
     no shadow. It sits at 40% until you approach it. Pointer-only
     chrome, hidden below 1024px where the phone gets the scroll
     narrative uninterrupted.
     ------------------------------------------------------------ */
  .section-rail { display: none; }
  @media (min-width: 1024px) {
    .section-rail {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      position: fixed; top: 50%; right: clamp(12px, 1.3vw, 30px);
      transform: translateY(-50%);
      z-index: 58; padding: 14px 7px;
      opacity: 0.4;
      transition: opacity .35s var(--ease-out);
    }
    .section-rail:hover, .section-rail:focus-within { opacity: 1; }
  }
  .section-rail__track {
    position: absolute; top: 16px; bottom: 16px; width: 1px;
    background: var(--hairline-strong); z-index: 0;
  }
  .section-rail__dot {
    position: relative; z-index: 1;
    width: 26px; height: 22px; padding: 0; margin: 0;
    border: none; background: none; cursor: pointer;
    display: grid; place-items: center;
  }
  .section-rail__dot::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--hairline-strong);
    transition: transform .3s var(--ease-spring), background .3s var(--ease-out), box-shadow .3s var(--ease-out);
  }
  .section-rail__dot:hover::before { transform: scale(1.4); background: var(--text-muted); }
  .section-rail__dot.is-active::before {
    background: var(--sienna); transform: scale(1.45);
    box-shadow: 0 0 0 3px rgba(188,90,55,0.14);
  }
  .section-rail__dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .section-rail__label {
    position: absolute; right: calc(100% + 10px); white-space: nowrap;
    font-family: var(--font-text); font-size: 11px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-body);
    background: var(--material-chrome);
    -webkit-backdrop-filter: var(--blur-chrome); backdrop-filter: var(--blur-chrome);
    border: 1px solid var(--chrome-hairline); border-radius: var(--radius-pill);
    padding: 6px 11px; pointer-events: none;
    opacity: 0; transform: translateX(6px);
    transition: opacity .24s var(--ease-out), transform .24s var(--ease-out);
  }
  .section-rail__dot:hover .section-rail__label,
  .section-rail__dot:focus-visible .section-rail__label { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .section-rail__dot::before, .section-rail__label { transition: none; }
    .section-rail__label { transform: none; }
  }
  @supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    .section-rail__label { background: var(--paper); }
  }

  /* ------------------------------------------------------------
     Interaction surfaces. Pressable supplies the pointer-tracked
     transform; these add the surface response that goes with it.
     ------------------------------------------------------------ */
  .cta-arrow { display: inline-block; transition: transform .24s var(--ease-out); }
  .pressable:hover .cta-arrow { transform: translateX(3px); }
  .cta-ink:hover { box-shadow: 0 14px 30px -16px rgba(20,20,26,0.55), 0 28px 60px -34px rgba(188,90,55,0.5); }
  .cta-outline { transition: border-color .24s var(--ease-out), background .24s var(--ease-out), color .24s var(--ease-out); }
  .cta-outline:hover { border-color: rgba(188,90,55,0.55); color: var(--sienna-deep); background: rgba(188,90,55,0.06); }
  .award-card:hover { box-shadow: var(--shadow-lg), 0 44px 80px -52px rgba(188,90,55,0.5); }
  .bay-preview:hover { box-shadow: var(--shadow-lg), 0 50px 90px -44px rgba(232,154,92,0.42); }
  @media (prefers-reduced-motion: reduce) { .pressable:hover .cta-arrow { transform: none; } }

  /* Resume columns. Bildungsweg is the shorter of the two timelines, so on
     wide screens it takes the narrower column and both start at the top;
     the pair stops ending in a ragged void. !important because the grid is
     declared inline by the component. */
  @media (min-width: 980px) {
    .resume-grid { grid-template-columns: minmax(0, 1.18fr) minmax(0, 0.92fr) !important; }
  }

  /* torn-paper deep-dives + photo treatments */
  .tear-trigger:hover .tear-label { color: var(--sienna); }
  .tear-trigger:hover .tear-label > span:last-child { background: rgba(188,90,55,0.10); border-color: rgba(188,90,55,0.30); }
  .loose-photo:hover { transform: rotate(0deg) translateY(-4px) !important; }
  .polaroid:hover { transform: rotate(0deg) scale(1.02) !important; z-index: 2; }
  .ggi-link { transition: transform .24s var(--ease-out), box-shadow .24s var(--ease-out); }
  .ggi-link:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  @media (prefers-reduced-motion: reduce) {
    .loose-photo, .polaroid { transition: none !important; }
    .tear-panel { transition: none !important; }

    /* The reveal and the hero sequence are rendered unconditionally (the page
       is prerendered in Node, so the components cannot branch on a media
       query without breaking hydration). Reduced motion is honoured here:
       no travel, no defocus, no scale - content simply fades up in place. */
    .js-reveal, .hero-line, .hero-photo {
      transform: none !important;
      filter: none !important;
    }
    .js-reveal { transition: opacity var(--dur-reveal) linear !important; }
    .hero-line, .hero-photo, .hero-hint { transition: opacity .3s linear !important; }
  }

  /* hero: progressive-enhancement fallback for browsers without svh */
  .hero { min-height: 100vh; min-height: 100svh; }

  /* Hero name track. The name is the ONLY text allowed out of the reading
     column: at 21:9 a 1080px-capped, 120px-max name sits marooned in the
     middle of the canvas, which is exactly the "lost in the width" failure
     the brief rules out. The block widens in two steps and the display cut
     (--fs-display-hero) carries it to 160px. Body measures are untouched. */
  .hero-namewrap { max-width: var(--content); margin-inline: auto; width: 100%; }
  @media (min-width: 1760px) { .hero-namewrap { max-width: var(--content-wide); } }
  @media (min-width: 2000px) { .hero-namewrap { max-width: var(--content-full); } }
  /* optical tightening grows with size, as large display type needs */
  @media (min-width: 1760px) { .hero-name { letter-spacing: -0.032em; } }

  /* hero portrait — widescreen only; below 1440px there isn't clearance
     between the name and the ambient blob, so it stays hidden and the
     hero renders exactly as before on phone/tablet/laptop. */
  .hero-photo { display: none; }
  @media (min-width: 1440px) {
    .hero-photo { display: block; }
  }

  /* per-section alignment (AlignBlock) is DESKTOP-ONLY. Below 768px it
     collapses back to centred/full-width, so phones/tablets render as before. */
  @media (max-width: 768px) {
    .align-block { margin-inline: auto !important; max-width: 100% !important; }
  }

  /* AlignBlock displacement track — any .container that holds AlignBlocks widens
     on big screens so the left/right offset uses more of the viewport. The copy
     itself stays at a readable measure (each AlignBlock caps its own max-width);
     only the empty space the block is pushed across grows. Below 1280px it equals
     a normal .container, so tablet/mobile are untouched. */
  @media (min-width: 1280px) { .container.align-track { max-width: var(--content-wide); } }
  @media (min-width: 1760px) { .container.align-track { max-width: var(--content-full); } }

  /* Desktop-only fills for the empty half of aligned sections (Story thesis
     figure, Intro/Engagement photo clusters). Hidden below 1440px so the larger
     imagery always has clearance from the text column; phone/tablet/small-laptop
     render identically to before. */
  .fill-slot { display: none; }
  @media (min-width: 1440px) {
    .fill-slot { display: block; position: absolute; top: 50%; transform: translateY(-50%); z-index: 1; }
    .fill-slot--left  { left:  clamp(24px, 4vw, 96px); }
    .fill-slot--right { right: clamp(24px, 4vw, 96px); }
  }
  @media (min-width: 1760px) {
    .fill-slot--left  { left:  clamp(48px, 7vw, 220px); }
    .fill-slot--right { right: clamp(48px, 7vw, 220px); }
  }

  /* Story: two thesis figures share a desktop grid with the narrative (≥1440px).
     Below 1440 the figures are hidden and the narrative renders exactly as
     before (so phone/tablet/small-laptop are untouched). A grid — rather than
     an absolute slot — lets the section grow to fit the two stacked charts. */
  .story-figs { display: none; }
  @media (min-width: 1440px) {
    .story-grid { display: grid; grid-template-columns: minmax(0, 500px) 1fr; gap: clamp(40px, 5vw, 96px); align-items: center; }
    .story-figs { display: flex; flex-direction: column; gap: clamp(22px, 2.6vw, 40px); }
  }

  /* mobile-only layout fixes — none of these apply at desktop widths */
  @media (max-width: 560px) {
    /* section headers: stack the heading above the decorative glow on phones */
    .section-head { flex-direction: column; align-items: flex-start; gap: 20px; }
    .section-head__deco { align-self: flex-end; }
    /* the mark and its halo scale together, so it stays an ornament instead of
       taking over a 390px column */
    .section-head__glow { transform: scale(0.62); transform-origin: right center; }

    /* hero: shrink the ambient shapes into the corners so the name owns the
       frame. They keep their FULL ink value - the old opacity override
       rendered them as a washed-out grey mass over a third of the screen,
       which is the opposite of the near-black-shape-over-coloured-glow
       motif. Smaller, not fainter. */
    .hero-glow-blob { transform: scale(0.46); transform-origin: top right; }
    .lang-hint { display: none !important; }
    .hero-glow-arch { transform: scale(0.42); transform-origin: bottom left; }

    /* the scroll hint sits clear of the home indicator */
    .hero-hint { bottom: max(30px, env(safe-area-inset-bottom, 0px)) !important; }

    /* Intro (navy band): shrink + tuck the ambient circle into the corner so
       it doesn't wash out the headline text wrapping beneath it on phones */
    .intro-glow { transform: scale(0.55); transform-origin: top right; opacity: 0.6 !important; }

    /* Engagement (sienna band): shrink + tuck the ambient blob into the
       corner so it clears the timeline entries above it */
    .engagement-glow { transform: scale(0.55); transform-origin: bottom right; opacity: 0.7 !important; }

    /* Next-Game preview tile: let it grow to fit its content instead of clipping
       the wrapped stat row inside a fixed 16/10 box */
    .bay-preview { aspect-ratio: auto !important; min-height: 0 !important; }
  }
</style>

         .parallax { transform: none !important; }</style>
