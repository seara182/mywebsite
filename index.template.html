<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"></script>
<style>
  html { scroll-behavior: smooth; overflow-x: hidden; }
  body { margin: 0; background: var(--paper); overflow-x: hidden; }
  @keyframes scrollHint { 0% { transform: translateY(-100%); } 60%,100% { transform: translateY(220%); } }

  /* owns the stacking context for the depth planes */
  #root { position: relative; z-index: 0; }

  .skipper {
    position: fixed; top: 0; left: 0; right: 0; z-index: 58;
    display: flex; justify-content: center;
    background: var(--material-chrome);
    -webkit-backdrop-filter: var(--blur-chrome); backdrop-filter: var(--blur-chrome);
    border-bottom: 1px solid var(--chrome-hairline);
    opacity: 0; transform: translateY(-100%); pointer-events: none;
    transition: opacity .3s var(--ease-out), transform .42s var(--ease-emphasized);
  }
  .skipper.is-visible { opacity: 1; transform: none; pointer-events: auto; }
  .skipper__track {
    display: flex; align-items: center;
    width: 100%; max-width: var(--content);
    padding: 0 var(--gutter);
    overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
    scroll-snap-type: x proximity; overscroll-behavior-x: contain;
  }
  .skipper__track::-webkit-scrollbar { display: none; }
  .skipper__link {
    flex: none; scroll-snap-align: start;
    padding: 15px 0; white-space: nowrap; text-decoration: none;
    font-family: var(--font-text); font-size: 12px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-muted);
    transition: color .2s var(--ease-out);
  }
  /* pseudo-element, so it stays out of the a11y tree */
  .skipper__link + .skipper__link::before {
    content: "\00B7"; display: inline-block; margin: 0 14px;
    color: var(--hairline-strong); font-weight: 400; letter-spacing: 0;
  }
  .skipper__link:hover { color: var(--ink); }
  .skipper__link.is-active { color: var(--accent); }
  .skipper__link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  /* .has-skipper is toggled by SectionSkipper */
  .lang-switcher { transition: top .42s var(--ease-emphasized), opacity .6s var(--ease-emphasized); }
  .has-skipper .lang-switcher { top: 68px; }

  @media (max-width: 560px) {
    .skipper__link { font-size: 11px; padding: 13px 0; }
    .skipper__link + .skipper__link::before { margin: 0 10px; }
    .has-skipper .lang-switcher { top: 62px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .skipper { transform: none; transition: opacity .2s linear; }
    .lang-switcher { transition: opacity .2s linear; }
  }
  @supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    .skipper { background: var(--paper); }
  }

  .seeking {
    display: grid;
    grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
    gap: clamp(24px, 4vw, 72px);
    align-items: start;
  }
  .seeking__list {
    display: grid; grid-template-columns: max-content minmax(0, 1fr);
    gap: 0 clamp(20px, 2.6vw, 40px); margin: 0;
  }
  .seeking__k, .seeking__v {
    border-bottom: 1px solid var(--hairline);
    padding: 12px 0;
  }
  .seeking__list > .seeking__k:first-of-type,
  .seeking__list > .seeking__k:first-of-type + .seeking__v { padding-top: 0; }
  .seeking__k {
    font-family: var(--font-mono); font-size: var(--fs-caption);
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted);
  }
  .seeking__v {
    margin: 0; font-size: var(--fs-body); line-height: 1.45;
    color: var(--heading); font-weight: 500;
  }
  @media (max-width: 860px) {
    .seeking { grid-template-columns: 1fr; }
    /* one rule under each pair instead of per column */
    .seeking__list { grid-template-columns: 1fr; gap: 0; }
    .seeking__k { border-bottom: none; padding: 14px 0 2px; }
    .seeking__list > .seeking__k:first-of-type + .seeking__v { padding-top: 0; }
    .seeking__v { padding-top: 0; }
  }

  /* margin-left:50% + translateX(-50%) escapes any centred .container: a
     centred container's content-box centre IS the viewport centre */
  .split {
    /* 100vw includes the scrollbar; widgets.js publishes the width as --sbw */
    width: calc(100vw - var(--sbw, 0px));
    margin-left: 50%; transform: translateX(-50%);
    display: grid; grid-template-columns: 1fr 1fr; align-items: stretch; gap: 0;
  }
  /* the copy sets the row height, so a wider copy column means a shorter row
     and the photo is scaled up less. Must stay between .split and the stacking
     rule below: all three are single-class, so source order decides. */
  .split--bleed { grid-template-columns: 60fr 40fr; }
  .split__copy {
    min-width: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding-block: clamp(28px, 4vw, 64px);
    padding-left: max(var(--gutter), calc(50vw - var(--content) / 2));
    padding-right: clamp(28px, 4vw, 72px);
  }
  .split--flip .split__copy {
    grid-column: 2; grid-row: 1;
    padding-left: clamp(28px, 4vw, 72px);
    padding-right: max(var(--gutter), calc(50vw - var(--content) / 2));
  }
  .split__media {
    position: relative; margin: 0; min-width: 0; overflow: hidden;
    /* no fixed height: the copy sets it; this is just a floor */
    min-height: clamp(380px, 44vw, 680px);
  }
  .split--flip .split__media { grid-column: 1; grid-row: 1; }
  /* the section's block padding, handed back as a negative margin; the
     WaveBlend seams are drawn over the result */
  .split--bleed .split__media {
    margin-top: calc(-1 * var(--split-bleed-top, 0px));
    margin-bottom: calc(-1 * var(--split-bleed-bottom, 0px));
  }
  .split--bleed .split__cap { padding-bottom: 60px; }
  .split__img {
    position: absolute; inset: 0;
    display: block; width: 100%; height: 100%; object-fit: cover;
  }
  .split__cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 56px clamp(20px, 2.4vw, 34px) 16px;
    text-align: right;
    font-family: var(--font-mono); font-size: var(--fs-caption); line-height: 1.45;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 1px 3px rgba(0,0,0,0.75);
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.30) 38%, rgba(0,0,0,0.72));
  }
  .split--flip .split__cap { text-align: left; }
  /* ultrawide: cap the media column so the copy takes the extra width */
  @media (min-width: 1760px) {
    .split { grid-template-columns: 1fr minmax(0, 40vw); }
    .split--flip { grid-template-columns: minmax(0, 40vw) 1fr; }
    .split--bleed { grid-template-columns: 1fr minmax(0, 30vw); }
  }
  /* below this the bleeding media column is narrower than the photo's subject,
     so no crop keeps a head whole; .split keeps its own 900px breakpoint */
  @media (max-width: 1250px) {
    .split--bleed { grid-template-columns: 1fr; }
    .split--bleed .split__media {
      grid-column: 1; grid-row: 1;
      min-height: clamp(260px, 48vh, 420px);
      margin-bottom: 0;
    }
    .split--bleed .split__copy {
      grid-column: 1; grid-row: 2;
      padding-inline: var(--gutter);
      padding-block: clamp(24px, 6vw, 40px);
    }
    .split--bleed .split__cap {
      padding: 52px var(--gutter) 14px; text-align: left; font-size: 11px;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,0.38) 34%, rgba(0,0,0,0.78));
    }
  }
  @media (max-width: 900px) {
    .split, .split--flip { grid-template-columns: 1fr; }
    .split__media, .split--flip .split__media {
      grid-column: 1; grid-row: 1;
      min-height: clamp(260px, 48vh, 420px);
    }
    .split--bleed .split__media { margin-bottom: 0; }
    .split--bleed .split__cap { padding-bottom: 14px; }
    .split__copy, .split--flip .split__copy {
      grid-column: 1; grid-row: 2;
      padding-inline: var(--gutter);
      padding-block: clamp(24px, 6vw, 40px);
    }
    .split__cap, .split--flip .split__cap {
      padding: 52px var(--gutter) 14px; text-align: left;
      font-size: 11px;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,0.38) 34%, rgba(0,0,0,0.78));
    }
  }

  /* Pressable supplies the transform; these are the surface response */
  .cta-arrow { display: inline-block; transition: transform .24s var(--ease-out); }
  .pressable:hover .cta-arrow { transform: translateX(3px); }
  .cta-ink:hover { box-shadow: 0 14px 30px -16px rgba(20,20,26,0.55), 0 28px 60px -34px rgb(var(--accent-2-rgb) / 0.5); }
  .cta-outline { transition: border-color .24s var(--ease-out), background .24s var(--ease-out), color .24s var(--ease-out); }
  .cta-outline:hover { border-color: rgb(var(--accent-2-rgb) / 0.55); color: var(--sage-deep); background: rgb(var(--accent-2-rgb) / 0.06); }
  .award-card:hover { box-shadow: var(--shadow-lg), 0 44px 80px -52px rgb(var(--accent-2-rgb) / 0.5); }
  .bay-preview:hover { box-shadow: var(--shadow-lg), 0 50px 90px -44px rgb(var(--accent-2-glow-rgb) / 0.42); }
  @media (prefers-reduced-motion: reduce) { .pressable:hover .cta-arrow { transform: none; } }

  /* !important: the grid is declared inline by the component */
  @media (min-width: 980px) {
    .resume-grid { grid-template-columns: minmax(0, 1.18fr) minmax(0, 0.92fr) !important; }
  }

  .tear-trigger:hover .tear-label { color: var(--sage); }
  .tear-trigger:hover .tear-label > span:last-child { background: rgb(var(--accent-2-rgb) / 0.10); border-color: rgb(var(--accent-2-rgb) / 0.30); }
  .loose-photo:hover { transform: rotate(0deg) translateY(-4px) !important; }
  .polaroid:hover { transform: rotate(0deg) scale(1.02) !important; z-index: 2; }
  .ggi-link { transition: transform .24s var(--ease-out), box-shadow .24s var(--ease-out); }
  .ggi-link:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  @media (prefers-reduced-motion: reduce) {
    .loose-photo, .polaroid { transition: none !important; }
    .tear-panel { transition: none !important; }

    /* the components cannot branch on this media query without breaking
       hydration, so reduced motion is honoured here instead */
    .js-reveal, .hero-line, .hero-photo {
      transform: none !important;
      filter: none !important;
    }
    .js-reveal { transition: opacity var(--dur-reveal) linear !important; }
    .hero-line, .hero-photo, .hero-hint { transition: opacity .3s linear !important; }
  }

  /* clips sideways only, so the ambient shapes bleed past the bottom edge and
     the plum band hides them along its wave instead of a hard straight cut */
  .hero { min-height: 100vh; min-height: 100svh; overflow-x: clip; }
  @supports not (overflow-x: clip) { .hero { overflow: hidden; } }

  /* the name is the only text allowed out of the reading column */
  .hero-namewrap { max-width: var(--content); margin-inline: auto; width: 100%; }
  @media (min-width: 1760px) { .hero-namewrap { max-width: var(--content-wide); } }
  @media (min-width: 2000px) { .hero-namewrap { max-width: var(--content-full); } }
  @media (min-width: 1760px) { .hero-name { letter-spacing: -0.032em; } }

  /* widescreen only: below 1440px it has no clearance from the name */
  .hero-photo { display: none; }
  @media (min-width: 1440px) {
    .hero-photo { display: block; }
  }

  @media (max-width: 768px) {
    .align-block { margin-inline: auto !important; max-width: 100% !important; }
  }

  /* widens the track the AlignBlocks are pushed across; each block still caps
     its own measure */
  @media (min-width: 1280px) { .container.align-track { max-width: var(--content-wide); } }
  @media (min-width: 1760px) { .container.align-track { max-width: var(--content-full); } }

  /* z-index lifts the caption over the Scribble in the same figure: a
     positioned z-index:0 element otherwise paints over static text */
  .photo-cap { position: relative; z-index: 2; text-shadow: 0 1px 2px rgba(0,0,0,0.40); }

  /* fills the empty half of an aligned section; hidden below 1440px */
  .fill-slot { display: none; }
  @media (min-width: 1440px) {
    .fill-slot { display: block; position: absolute; top: 50%; transform: translateY(-50%); z-index: 1; }
    .fill-slot--left  { left:  clamp(24px, 4vw, 96px); }
    .fill-slot--right { right: clamp(24px, 4vw, 96px); }
  }
  @media (min-width: 1760px) {
    .fill-slot--left  { left:  clamp(48px, 7vw, 220px); }
    .fill-slot--right { right: clamp(48px, 7vw, 220px); }
  }

  /* a grid, not an absolute slot, so the section grows to fit the charts */
  .story-figs { display: none; }
  @media (min-width: 1440px) {
    .story-grid { display: grid; grid-template-columns: minmax(0, 500px) 1fr; gap: clamp(40px, 5vw, 96px); align-items: center; }
    .story-figs { display: flex; flex-direction: column; gap: clamp(22px, 2.6vw, 40px); }
  }

  @media (max-width: 560px) {
    .section-head { flex-direction: column; align-items: flex-start; gap: 20px; }
    .section-head__deco { align-self: flex-end; }
    /* mark and halo scale together */
    .section-head__glow { transform: scale(0.62); transform-origin: right center; }

    /* smaller, not fainter: the ink value stays */
    .hero-glow-blob { transform: scale(0.46); transform-origin: top right; }
    .lang-hint { display: none !important; }
    .hero-glow-arch { transform: scale(0.42); transform-origin: bottom left; }

    .hero-hint { bottom: max(30px, env(safe-area-inset-bottom, 0px)) !important; }

    .intro-glow { transform: scale(0.55); transform-origin: top right; opacity: 0.6 !important; }

    /* clears the timeline entries above it */
    .engagement-glow { transform: scale(0.8); transform-origin: bottom right; opacity: 0.7 !important; }

    /* grow to fit the wrapped stat row instead of clipping it */
    .bay-preview { aspect-ratio: auto !important; min-height: 0 !important; }
  }
</style>
<noscript>
  <!-- without JS the reveal observers never fire, so force everything visible -->
  <style>.js-reveal, .hero-line, .hero-photo { opacity: 1 !important; transform: none !important; filter: none !important; }
         .parallax { transform: none !important; }
         /* revealed by an observer, so without JS it would never appear */
         .skipper { position: static; opacity: 1 !important; transform: none !important; pointer-events: auto !important; }</style>
</noscript>
