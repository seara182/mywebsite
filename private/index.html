<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Private</title>
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="../ci/icons/favicon-32.png">
<link rel="apple-touch-icon" href="../ci/icons/apple-touch-icon.png">
<link rel="stylesheet" href="../ci/styles.css">
<style>
  /* these were never defined in ci/tokens, which left white text on grey */
  :root { --navy: #1B2A3D; }

  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--navy);
    overflow: hidden;
  }

  .mystical-container {
    position: relative;
    width: 100%;
    height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #content {
    position: relative;
    z-index: 10;
  }

  .content-nav {
    background: var(--paper);
    padding: clamp(40px, 8vw, 80px);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    max-width: 420px;
    width: 90%;
    border: 1px solid var(--border);
  }

  .content-nav h2 {
    font-family: var(--font-display);
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 24px 0;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .content-nav a {
    display: block;
    padding: 16px 20px;
    margin-bottom: 12px;
    background: var(--navy);
    color: white;
    text-decoration: none;
    border-radius: var(--radius-md);
    font-family: var(--font-display);
    font-size: var(--t-label);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 240ms var(--ease-glide);
  }

  .content-nav a:hover {
    background: #0f1a2a;
    transform: translateX(8px);
  }

  .legal {
    position: absolute;
    bottom: 24px;
    z-index: 10;
    font-family: var(--font-text);
    font-size: var(--fs-caption);
    color: var(--on-dark-muted);
  }
</style>
</head>
<body>
<div class="mystical-container">

  <div id="content" class="content-nav">
    <h2>Archive</h2>
    <a href="haribo-monster/">Haribo & Monster Tier List</a>
    <a href="fragen/">Charakterfragen würfeln</a>
    <a href="master/">Masteranalyse</a>
    <a href="ophelia/">Knieorthese (3D-Viewer)</a>
  </div>
  <a class="legal" href="../impressum/">Impressum &amp; Datenschutz</a>
</div>
</body>
</html>
