<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private</title>
<link rel="icon" href="../ci/icons/Favicon32x.ico">
<link rel="apple-touch-icon" href="../ci/icons/Favicon128x.ico">
<link rel="stylesheet" href="../ci/styles.css">
<style>
  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--navy) 0%, #0d1620 100%);
    overflow: hidden;
  }

  .mystical-container {
    position: relative;
    width: 100%;
    height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .glow-backdrop {
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, var(--glow-duo) 0%, transparent 70%);
    border-radius: 50%;
    opacity: 0.3;
    animation: drift 20s ease-in-out infinite;
  }

  .glow-backdrop:nth-child(1) {
    top: 10%;
    left: 5%;
    width: 250px;
    height: 250px;
    animation-delay: 0s;
  }

  .glow-backdrop:nth-child(2) {
    bottom: 15%;
    right: 10%;
    width: 350px;
    height: 350px;
    animation-delay: 7s;
    background: radial-gradient(circle, var(--glow-white) 0%, transparent 70%);
  }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(30px, -30px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow-backdrop {
      animation: none;
    }
  }

  #content {
    position: relative;
    z-index: 10;
  }

  .content-nav {
    background: var(--paper);
    padding: clamp(40px, 8vw, 80px);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    max-width: 420px;
    width: 90%;
    border: 1px solid var(--border);
  }

  .content-nav h2 {
    font-family: var(--font-display);
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 24px 0;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .content-nav a {
    display: block;
    padding: 16px 20px;
    margin-bottom: 12px;
    background: var(--navy);
    color: white;
    text-decoration: none;
    border-radius: var(--radius-md);
    font-family: var(--font-display);
    font-size: var(--t-label);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 240ms var(--ease-glide);
  }

  .content-nav a:hover {
    background: #0f1a2a;
    transform: translateX(8px);
  }
</style>
</head>
<body>
<div class="mystical-container">
  <div class="glow-backdrop"></div>
  <div class="glow-backdrop"></div>

  <div id="content" class="content-nav">
    <h2>Archive</h2>
    <a href="haribo-monster/">Haribo & Monster Tier List</a>
    <a href="fragen/">Charakterfragen würfeln</a>
    <a href="master/">Masteranalyse</a>
    <a href="graph-preview/">Graph-Navigation (Konzept)</a>
  </div>
</div>
</body>
</html>
