<!DOCTYPE html>
<html lang="de" data-outlet="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Mika Jeske</title>
<meta name="robots" content="noindex">
<meta name="description" content="Seite nicht gefunden.">
<!-- GitHub Pages serves this file for any missing path at any depth, so every URL below is absolute. -->
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/ci/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/ci/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/ci/styles.css">
<style>
  html { color-scheme: dark; }
  ::selection { background: rgb(255 255 255 / .32); color: var(--on-dark-strong); }
  /* outlet variants: only the one matching html[data-outlet] shows (default de) */
  .o { display: none; }
  html[data-outlet="de"] .o-de, html[data-outlet="fr"] .o-fr, html[data-outlet="it"] .o-it, html[data-outlet="us"] .o-us { display: inline; }
  body {
    min-height: 100vh; min-height: 100dvh; margin: 0;
    display: grid; place-items: center; padding: 32px 16px;
    background:
      radial-gradient(60% 70% at 30% 55%, rgb(var(--accent-2-glow-rgb) / .22), transparent 70%),
      linear-gradient(135deg, var(--sage-deep), var(--sage) 60%, #14301F);
    color: var(--on-dark-body);
  }
  main {
    width: min(1040px, 100%); display: grid; gap: clamp(20px, 4vw, 56px);
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center;
  }

  /* photo: transparent cut-out, so it sits straight on the background */
  .pic { margin: 0; text-align: center; }
  /* scene = photo (left 80%) + a right-hand strip for the socket; the SVG overlay shares the photo's coordinates (632x490) */
  .pic__frame { position: relative; width: min(100%, 560px); aspect-ratio: 632 / 490; margin-inline: auto; }
  .pic__frame::after { /* soft ground shadow under the hooves */
    content: ""; position: absolute; left: 5%; right: 25%; bottom: 0; height: 5%;
    background: radial-gradient(closest-side, rgb(0 0 0 / .38), transparent);
    filter: blur(3px);
  }
  .pic .scene__photo {
    position: absolute; z-index: 1; left: 0; top: 0; display: block; width: 80.06%; height: auto;
    filter: drop-shadow(0 14px 18px rgb(0 0 0 / .28));
  }
  .scene__art { position: absolute; z-index: 2; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  /* the caught cable end sways, the loose plug sparks */
  .wire-loose { transform-origin: 490px 93px; animation: sway 1.6s ease-in-out infinite alternate; }
  .spark { animation: zap 1.4s steps(1, end) infinite; }
  @keyframes sway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
  @keyframes zap  { 0%, 55%, 100% { opacity: 0; } 60%, 68% { opacity: 1; } 76% { opacity: 0; } 82% { opacity: 1; } 88% { opacity: 0; } }
  .pic figcaption { margin-top: 14px; font-size: 15px; line-height: 1.45; color: var(--on-dark-body); }
  .pic figcaption strong { color: var(--on-dark-strong); font-weight: 600; }
  .pic figcaption small { display: block; margin-top: 2px; font-size: 13px; opacity: .7; }

  .code {
    font-family: var(--font-display); font-weight: 700; letter-spacing: -.04em; line-height: .9;
    font-size: clamp(88px, 16vw, 168px); color: var(--on-dark-strong); margin: 0 0 14px;
  }
  h1 { font-size: clamp(26px, 3.6vw, 40px); font-weight: 600; color: var(--on-dark-strong); margin: 0 0 14px; }
  p.msg { font-size: clamp(17px, 1.6vw, 20px); line-height: 1.5; max-width: 34ch; margin: 0 0 24px; }

  /* fun-fact line: a quiet aside, centred near the bottom of the frame (no box, no outline) */
  body { position: relative; padding-bottom: calc(1cm + 7rem); }
  .fact {
    --lines: 3;
    position: absolute; left: 50%; bottom: 1cm; transform: translateX(-50%);
    width: min(440px, calc(100% - 32px)); margin: 0;
    display: flex; align-items: center; gap: 4px;
  }
  .fact[hidden] { display: none; }
  .fact--pending { visibility: hidden; }
  .fact__body { flex: 1; min-width: 0; text-align: center; }
  .fact__label { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--sage-glow); opacity: .75; margin-bottom: 3px; }
  .fact__text {
    display: block; font-size: 14px; line-height: 1.45; font-weight: 400; color: var(--on-dark-body); opacity: .85;
    min-height: calc(1.45em * var(--lines)); /* reserve the room so shuffling never shifts the layout */
    transition: opacity .25s ease;
  }
  .fact__text.is-out { opacity: 0; }
  .shuffle {
    flex: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; cursor: pointer;
    background: none; opacity: .6; display: grid; place-items: center;
    transition: opacity .2s ease, transform .2s var(--ease-out, ease);
  }
  .shuffle img { width: 22px; height: 22px; display: block; }
  .shuffle:hover { opacity: 1; }
  .shuffle:active { transform: scale(.92); }
  .shuffle:focus-visible { outline-color: var(--sage-glow); opacity: 1; }
  .shuffle.rolling { opacity: 1; }
  .shuffle.rolling img { animation: swap .7s ease-in-out; }
  @keyframes swap {
    0%   { transform: translateX(0) scale(1); }
    25%  { transform: translateX(-4px) scale(1.18); }
    55%  { transform: translateX(4px) scale(1.18); }
    100% { transform: translateX(0) scale(1); }
  }

  .home {
    display: inline-flex; align-items: center; gap: 10px; padding: 14px 26px; border-radius: 999px;
    background: var(--on-dark-strong); color: var(--sage-deep); font-weight: 600; font-size: 17px;
    transition: transform .25s var(--ease-out, ease), box-shadow .25s;
  }
  .home:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgb(0 0 0 / .3); }
  .home:focus-visible { outline-color: var(--sage-glow); }

  @media (prefers-reduced-motion: reduce) {
    .wire-loose { animation: none; }
    .spark { animation: none; opacity: 1; }
    .shuffle.rolling img { animation: none; }
    .shuffle, .home, .fact__text { transition: none; }
    .home:hover { transform: none; }
  }
  /* stack only on narrow portrait screens; landscape phones keep two columns so nothing scrolls */
  @media (max-width: 760px) and (orientation: portrait) {
    main { grid-template-columns: 1fr; text-align: center; }
    .pic__frame { width: min(100%, 360px); }
    p.msg { margin-inline: auto; }
    .fact { --lines: 4; }
    body { padding-top: 20px; }
  }
  @media (max-height: 480px) and (orientation: landscape) {
    body { padding: 16px; }
    .pic__frame { width: min(100%, 300px); }
    .pic figcaption { font-size: 13px; margin-top: 8px; }
    .pic figcaption small { display: none; }
    .code { font-size: 64px; margin-bottom: 6px; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    p.msg { font-size: 14px; margin-bottom: 12px; }
    body { padding-bottom: 64px; }
    .fact { --lines: 2; bottom: 8px; }
    .fact__label { display: none; }
    .fact__text { font-size: 12.5px; }
    .shuffle { width: 36px; height: 36px; }
    .shuffle img { width: 20px; height: 20px; }
    .home { padding: 10px 20px; font-size: 15px; }
  }
</style>
<noscript><style>.fact { display: none; }</style></noscript>
</head>
<body>
<main>
  <figure class="pic">
    <div class="pic__frame">
      <img class="scene__photo" src="/ci/assets/Bilder/Weitere/giraffen-diko-tessa.webp" width="506" height="490" decoding="async"
           alt="Die beiden Kordofan-Giraffen Diko und Tessa nebeneinander, freigestellt vor hellem Hintergrund">
    <svg class="scene__art" viewBox="0 0 632 490" aria-hidden="true" focusable="false">
    <!-- wall socket: one variant per country, chosen via html[data-outlet] -->
    <g transform="translate(142 12)">
      <rect x="426" y="250" width="44" height="60" rx="10" fill="#EDEAF0"/>
      <!-- US (type A/B) -->
      <g class="o o-us">
        <rect x="434" y="262" width="5" height="14" rx="2" fill="#1E4A33"/><rect x="452" y="262" width="5" height="14" rx="2" fill="#1E4A33"/>
        <circle cx="446" cy="292" r="4" fill="#1E4A33"/>
      </g>
      <!-- DE / ES (type F, Schuko): round recess, two round holes, earthing clips top + bottom -->
      <g class="o o-de">
        <circle cx="448" cy="280" r="18" fill="#DAD6DF"/>
        <circle cx="439" cy="280" r="3.6" fill="#1E4A33"/><circle cx="457" cy="280" r="3.6" fill="#1E4A33"/>
        <rect x="444" y="262" width="8" height="3.6" rx="1.5" fill="#B9B4C0"/><rect x="444" y="294.4" width="8" height="3.6" rx="1.5" fill="#B9B4C0"/>
      </g>
      <!-- FR (type E): round recess, two round holes, earth pin sticking out at the top -->
      <g class="o o-fr">
        <circle cx="448" cy="282" r="18" fill="#DAD6DF"/>
        <circle cx="439" cy="284" r="3.6" fill="#1E4A33"/><circle cx="457" cy="284" r="3.6" fill="#1E4A33"/>
        <rect x="446" y="266" width="4" height="9" rx="2" fill="#B9B4C0" stroke="#1E4A33" stroke-width="1"/>
      </g>
      <!-- IT (type L): three round holes in a row -->
      <g class="o o-it">
        <rect x="430" y="270" width="36" height="20" rx="10" fill="#DAD6DF"/>
        <circle cx="438" cy="280" r="3.2" fill="#1E4A33"/><circle cx="448" cy="280" r="3.2" fill="#1E4A33"/><circle cx="458" cy="280" r="3.2" fill="#1E4A33"/>
      </g>
    </g>


      <!-- cable hangs from the ceiling and ends in the tall giraffe's mouth -->
      <path d="M 590 -900 L 590 -30 C 590 50, 545 108, 490 93" fill="none" stroke="#15151A" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M 481 91.5 L 492 92.5" stroke="#15151A" stroke-width="6.5" stroke-linecap="round"/>

      <!-- chewed-off piece: hangs from the mouth, plug swinging near the socket -->
      <g class="wire-loose">
        <path d="M 490 95 C 518 128, 522 192, 526 238" fill="none" stroke="#15151A" stroke-width="6.5" stroke-linecap="round"/>
      <g transform="translate(526 238) rotate(12)">
        <rect x="-11" y="0" width="22" height="26" rx="5" fill="#EDEAF0"/>
        <g class="o o-us" fill="#B9B4C0">
          <rect x="-7" y="26" width="4" height="12" rx="1.5"/><rect x="3" y="26" width="4" height="12" rx="1.5"/><rect x="-1.6" y="26" width="3.2" height="8" rx="1.6"/>
        </g>
        <g class="o o-de">
          <rect x="-13" y="9" width="3" height="7" rx="1.2" fill="#B9B4C0"/><rect x="10" y="9" width="3" height="7" rx="1.2" fill="#B9B4C0"/>
          <g fill="#B9B4C0"><rect x="-10.5" y="26" width="5" height="13" rx="2.5"/><rect x="5.5" y="26" width="5" height="13" rx="2.5"/></g>
        </g>
        <g class="o o-fr">
          <ellipse cx="0" cy="22" rx="2.8" ry="2" fill="#1E4A33"/>
          <g fill="#B9B4C0"><rect x="-10.5" y="26" width="5" height="13" rx="2.5"/><rect x="5.5" y="26" width="5" height="13" rx="2.5"/></g>
        </g>
        <g class="o o-it" fill="#B9B4C0">
          <rect x="-10" y="26" width="3.6" height="12" rx="1.8"/><rect x="-1.8" y="26" width="3.6" height="12" rx="1.8"/><rect x="6.4" y="26" width="3.6" height="12" rx="1.8"/>
        </g>
      </g>
        <g stroke="#E8B04A" stroke-width="2" stroke-linecap="round">
          <line x1="487" y1="89" x2="482" y2="81"/><line x1="491" y1="88" x2="490" y2="79"/>
        </g>
      </g>

    <!-- spark between plug and socket -->
    <g class="spark" transform="translate(142 12)" stroke="#FFE27A" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M 404 266 l 8 -10 l -4 0 l 9 -12"/>
      <path d="M 398 250 l -10 -4 M 420 268 l 10 4"/>
    </g>
    </svg>
    </div>
    <figcaption>
      <span id="cap"><strong>Diko und Tessa</strong>, zwei Kordofan-Giraffen im Zoo Dresden.</span>
      <small id="credit">Foto: Mika Jeske</small>
    </figcaption>
  </figure>

  <section>
    <div class="code" aria-hidden="true">404</div>
    <h1 id="t">Verbindung unterbrochen.</h1>
    <p class="msg" id="d">Diko und Tessa haben das Kabel für ihr Mittagessen gehalten – diese Seite war Kollateralschaden.</p>

    <a class="home" id="h" href="/">Zur Startseite</a>
  </section>
</main>

<div class="fact fact--pending" id="factBox">
  <div class="fact__body">
    <span class="fact__label" id="factLabel">Giraffen-Fakt</span>
    <output class="fact__text" id="fact"></output>
  </div>
  <button class="shuffle" id="shuffle" type="button" aria-label="Zufälligen neuen Fakt zeigen">
    <img src="/ci/icons/shuffle.svg" width="22" height="22" alt="" decoding="async">
  </button>
</div>

<script>
  // Plain-JS language pick (no dependency on the app bundle): de is the default and lives in the HTML above.
  (function () {
    var L = {
      en: {
        t: "Connection lost.", d: "Diko and Tessa mistook the cable for lunch, and this page was collateral damage.",
        h: "Back to the homepage", title: "Page not found", label: "Giraffe fact", shuf: "Show another random fact",
        cap: "<strong>Diko and Tessa</strong>, two Kordofan giraffes at Dresden Zoo.", credit: "Photo: Mika Jeske",
        alt: "The two Kordofan giraffes Diko and Tessa standing side by side, cut out from their background"
      },
      fr: {
        t: "Connexion perdue.", d: "Diko et Tessa ont pris le câble pour leur déjeuner, et cette page est un dommage collatéral.",
        h: "Retour à l'accueil", title: "Page introuvable", label: "Fait sur les girafes", shuf: "Afficher un autre fait au hasard",
        cap: "<strong>Diko et Tessa</strong>, deux girafes du Kordofan au zoo de Dresde.", credit: "Photo : Mika Jeske",
        alt: "Les deux girafes du Kordofan Diko et Tessa côte à côte, détourées"
      },
      es: {
        t: "Conexión perdida.", d: "Diko y Tessa confundieron el cable con su almuerzo, y esta página fue un daño colateral.",
        h: "Volver al inicio", title: "Página no encontrada", label: "Dato sobre jirafas", shuf: "Mostrar otro dato al azar",
        cap: "<strong>Diko y Tessa</strong>, dos jirafas de Kordofán en el zoo de Dresde.", credit: "Foto: Mika Jeske",
        alt: "Las dos jirafas de Kordofán Diko y Tessa, una junto a la otra, recortadas del fondo"
      },
      it: {
        t: "Connessione interrotta.", d: "Diko e Tessa hanno scambiato il cavo per il pranzo, e questa pagina è un danno collaterale.",
        h: "Torna alla home", title: "Pagina non trovata", label: "Curiosità sulle giraffe", shuf: "Mostra un'altra curiosità a caso",
        cap: "<strong>Diko e Tessa</strong>, due giraffe del Kordofan allo zoo di Dresda.", credit: "Foto: Mika Jeske",
        alt: "Le due giraffe del Kordofan Diko e Tessa affiancate, ritagliate dallo sfondo"
      }
    };
    var lang = ((navigator.language || "de").slice(0, 2)).toLowerCase();
    var seg = location.pathname.split("/")[1];
    if (L[seg]) lang = seg; // a broken URL under /en/… keeps its language
    // wall outlet by country: Germany + Spain use Schuko (type F), France type E, Italy type L, English = USA
    document.documentElement.setAttribute("data-outlet", { de: "de", es: "de", fr: "fr", it: "it", en: "us" }[lang] || "de");
    var s = L[lang];
    if (s) {
      var $ = function (id) { return document.getElementById(id); };
      document.documentElement.lang = lang;
      $("t").textContent = s.t;
      $("d").textContent = s.d;
      $("cap").innerHTML = s.cap;
      $("credit").textContent = s.credit;
      $("factLabel").textContent = s.label;
      $("shuffle").setAttribute("aria-label", s.shuf);
      document.querySelector(".pic img").alt = s.alt;
      var h = $("h");
      h.textContent = s.h;
      h.href = "/" + lang + "/";
      document.title = "404 · " + s.title + " · Mika Jeske";
    }

    // Fun-fact shuffle: facts live in /ci/facts/<lang>.json (100 each). Every load shuffles once.
    var box = document.getElementById("factBox"), out = document.getElementById("fact"), shuf = document.getElementById("shuffle");
    var factLang = L[lang] ? lang : "de";
    var facts = [], current = -1, busy = false, touched = false;
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

    // uniform integer in [0, n) from the browser's CSPRNG (rejection sampling, so no modulo bias)
    function rnd(n) {
      var c = window.crypto || window.msCrypto;
      if (!c || !c.getRandomValues) return Math.floor(Math.random() * n);
      var a = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n;
      do { c.getRandomValues(a); } while (a[0] >= lim);
      return a[0] % n;
    }
    // never show the same fact twice in a row, not even across reloads
    function last() { try { var v = parseInt(sessionStorage.getItem("giraffeFact"), 10); return isNaN(v) ? -1 : v; } catch (e) { return -1; } }
    function remember(i) { try { sessionStorage.setItem("giraffeFact", String(i)); } catch (e) {} }
    function pick() {
      var i, avoid = current > -1 ? current : last();
      do { i = rnd(facts.length); } while (i === avoid && facts.length > 1);
      return i;
    }
    function roll() {
      if (busy || !facts.length) return;
      busy = true;
      var i = pick();
      var done = function () { current = i; remember(i); out.textContent = facts[i]; out.classList.remove("is-out"); };
      if (reduce) { done(); busy = false; return; }
      shuf.classList.remove("rolling"); void shuf.offsetWidth; shuf.classList.add("rolling");
      out.classList.add("is-out");
      setTimeout(done, 300);
      setTimeout(function () { shuf.classList.remove("rolling"); busy = false; }, 800);
    }
    shuf.addEventListener("click", function () {
      if (!touched) { touched = true; out.setAttribute("aria-live", "polite"); } // only announce facts the visitor asked for
      roll();
    });
    fetch("/ci/facts/" + factLang + ".json")
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        if (!data || !data.length) return;
        facts = data;
        // first frame: visible but empty, then the first fact shuffles in
        box.classList.remove("fact--pending");
        out.classList.add("is-out");
        roll();
      })
      .catch(function () { box.hidden = true; /* no facts, no box: the page stays clean */ });
  })();
</script>
</body>
</html>
